<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>BeKach | أرقام التحويل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1220; --bg2:#111b30; --card:#16223a; --line:#24334f;
    --text:#f4f7fb; --muted:#9fb0c8;
    --green:#22c55e; --green2:#16a34a;
    --vc:#e60000; --ip:#7c3aed;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#16315a 0%,var(--bg) 60%) fixed;
    color:var(--text); min-height:100vh; overflow-x:hidden;
  }

  /* ---------- Splash ---------- */
  #splash{
    position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px;
    background:radial-gradient(800px 500px at 50% 40%,#16315a 0%,var(--bg) 70%);
    transition:opacity .6s ease, visibility .6s ease;
  }
  #splash.hide{opacity:0; visibility:hidden}
  .logo-wrap{position:relative; width:130px; height:130px; display:grid; place-items:center}
  .ring{position:absolute; inset:0; border-radius:34px; border:2px solid var(--green); opacity:0; animation:ring 1.8s ease-out .5s infinite}
  .ring.r2{animation-delay:1.1s}
  @keyframes ring{0%{transform:scale(.8);opacity:.7}100%{transform:scale(1.6);opacity:0}}
  .logo{width:112px; height:112px; transform:scale(0) rotate(-20deg); animation:pop .9s cubic-bezier(.2,1.4,.4,1) .15s forwards}
  @keyframes pop{to{transform:scale(1) rotate(0)}}
  .brand{font-size:44px; font-weight:800; letter-spacing:1px; direction:ltr; opacity:0; transform:translateY(14px); animation:up .7s ease .8s forwards}
  .brand b{color:var(--green)}
  .tagline{color:var(--muted); font-size:16px; opacity:0; transform:translateY(10px); animation:up .7s ease 1.15s forwards}
  @keyframes up{to{opacity:1; transform:none}}
  .loader{width:120px; height:4px; background:#1f2f4d; border-radius:4px; overflow:hidden; margin-top:6px}
  .loader i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--green),#86efac); animation:load 2s ease .3s forwards}
  @keyframes load{to{width:100%}}

  /* ---------- Page ---------- */
  .wrap{max-width:520px; margin:0 auto; padding:22px 16px 60px}
  .reveal{opacity:0; transform:translateY(18px)}
  body.ready .reveal{animation:up .6s ease forwards; animation-delay:calc(var(--i,0) * 70ms)}

  header{display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:6px}
  header svg{width:46px; height:46px}
  header .name{font-size:30px; font-weight:800; direction:ltr}
  header .name b{color:var(--green)}
  h2{text-align:center; font-size:20px; font-weight:700; margin:10px 0 2px}
  .lead{text-align:center; color:var(--muted); font-size:15px; margin:0 0 18px}

  .steps{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px}
  .step{background:var(--bg2); border:1px solid var(--line); border-radius:16px; padding:12px 6px; text-align:center}
  .step .n{width:28px; height:28px; margin:0 auto 6px; border-radius:50%; background:var(--green); color:#04210f; font-weight:800; display:grid; place-items:center}
  .step span{font-size:13px; font-weight:600; line-height:1.5; display:block}

  .tabs{display:flex; gap:8px; background:var(--bg2); padding:6px; border-radius:16px; border:1px solid var(--line); margin-bottom:16px}
  .tab{flex:1; border:0; background:transparent; color:var(--muted); font:inherit; font-weight:700; font-size:14px; padding:10px 6px; border-radius:11px; cursor:pointer; transition:.2s}
  .tab.active{background:var(--green); color:#04210f}

  .group-title{display:flex; align-items:center; gap:8px; font-weight:700; font-size:16px; margin:20px 4px 10px}
  .dot{width:10px; height:10px; border-radius:50%}
  .dot.vc{background:var(--vc)} .dot.ip{background:var(--ip)}
  .count{margin-right:auto; color:var(--muted); font-weight:600; font-size:13px}

  .item{
    display:flex; align-items:center; gap:12px; width:100%;
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:14px; margin-bottom:10px; color:inherit; font:inherit; text-align:right; cursor:pointer;
    transition:transform .15s ease, border-color .2s, background .2s;
  }
  .item:active{transform:scale(.97)}
  .item:hover{border-color:#34507d}
  .avatar{flex:none; width:46px; height:46px; border-radius:14px; display:grid; place-items:center; font-weight:800; font-size:18px; color:#fff; direction:ltr}
  .avatar.vc{background:linear-gradient(135deg,#ff3b3b,#b80000)}
  .avatar.ip{background:linear-gradient(135deg,#9d6bff,#5b21b6)}
  .info{flex:1; min-width:0}
  .who{font-size:14px; color:var(--muted); font-weight:600; direction:ltr; text-align:right}
  .num{font-size:21px; font-weight:800; letter-spacing:1px; direction:ltr; text-align:right}
  .btn{flex:none; display:flex; align-items:center; gap:6px; background:var(--green); color:#04210f; font-weight:800; font-size:14px; padding:10px 14px; border-radius:12px; transition:.2s}
  .btn svg{width:16px; height:16px}
  .item.done{border-color:var(--green); background:#12301f}
  .item.done .btn{background:#fff}

  .note{margin-top:22px; padding:14px; border-radius:16px; background:var(--bg2); border:1px dashed var(--line); color:var(--muted); font-size:13.5px; line-height:1.9; text-align:center}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:22px; transform:translate(-50%,120px); width:calc(100% - 32px); max-width:480px;
    background:#fff; color:#0b1220; padding:14px 18px; border-radius:18px; font-weight:700; font-size:15px; line-height:1.7;
    box-shadow:0 12px 40px rgba(0,0,0,.45); transition:transform .35s cubic-bezier(.2,1,.3,1); z-index:40; text-align:center;
  }
  #toast.show{transform:translate(-50%,0)}
  #toast small{display:block; font-weight:600; color:#475569; font-size:13px}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important; animation-delay:0s !important; transition-duration:.01ms !important}
    .reveal{opacity:1; transform:none}
  }
</style>
</head>
<body>

<!-- شاشة البداية -->
<div id="splash">
  <div class="logo-wrap">
    <span class="ring"></span><span class="ring r2"></span>
    <svg class="logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="BeKach">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#15803d"/>
        </linearGradient>
      </defs>
      <rect width="120" height="120" rx="30" fill="url(#g1)"/>
      <path d="M40 28h24c13 0 20 7 20 16 0 6-3 10-8 13 7 3 11 8 11 15 0 11-8 20-23 20H40z" fill="#fff"/>
      <path d="M54 41v13h9c5 0 8-2 8-6.500S68 41 63 41zm0 28v14h10c6 0 9-3 9-7s-3-7-9-7z" fill="#15803d"/>
      <circle cx="90" cy="30" r="12" fill="#facc15"/>
      <text x="90" y="35" text-anchor="middle" font-size="15" font-weight="800" fill="#854d0e" font-family="Arial">£</text>
    </svg>
  </div>
  <div class="brand">Be<b>Kach</b></div>
  <div class="tagline">أرقام التحويل</div>
  <div class="loader"><i></i></div>
</div>

<!-- الصفحة -->
<div class="wrap">
  <header class="reveal" style="--i:0">
    <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <rect width="120" height="120" rx="30" fill="url(#g1)"/>
      <path d="M40 28h24c13 0 20 7 20 16 0 6-3 10-8 13 7 3 11 8 11 15 0 11-8 20-23 20H40z" fill="#fff"/>
      <path d="M54 41v13h9c5 0 8-2 8-6.500S68 41 63 41zm0 28v14h10c6 0 9-3 9-7s-3-7-9-7z" fill="#15803d"/>
      <circle cx="90" cy="30" r="12" fill="#facc15"/>
    </svg>
    <div class="name">Be<b>Kach</b></div>
  </header>

  <h2 class="reveal" style="--i:1">أرقام التحويل</h2>
  <p class="lead reveal" style="--i:2">اختار الرقم واضغط عليه، وهيتنسخ لوحده</p>

  <div class="steps reveal" style="--i:3">
    <div class="step"><div class="n">1</div><span>اضغط على الرقم</span></div>
    <div class="step"><div class="n">2</div><span>افتح تطبيق التحويل</span></div>
    <div class="step"><div class="n">3</div><span>الصق الرقم وحوّل</span></div>
  </div>

  <div class="tabs reveal" style="--i:4" id="tabs">
    <button class="tab active" data-f="all">الكل</button>
    <button class="tab" data-f="vc">فودافون كاش</button>
    <button class="tab" data-f="ip">إنستا باي</button>
  </div>

  <div id="list"></div>

  <div class="note reveal" style="--i:6">
    اتأكد من الاسم اللي بيظهر لك قبل ما تأكد التحويل،<br>ولو في أي مشكلة كلم المحل.
  </div>
</div>

<div id="toast"></div>

<script>
/* ===== البيانات: [الرقم, الاسم, النوع] ===== */
/* vc = فودافون كاش | ip = إنستا باي */
const DATA = [
  ["01055942436","Karim S","vc"],
  ["01055942417","Karim S","vc"],
  ["01042073401","Karim S","vc"],
  ["01055366519","Mohamed S","vc"],
  ["01055164733","Mohamed S","vc"],
  ["01008137806","Sarwat A","ip"],
  ["01035826232","Aya s m","vc"],
  ["01035895030","Aya s m","vc"],
  ["01024688189","Sarwat A","vc"],
  ["01018364785","Azza M","vc"],
  ["01013084346","Azza M","vc"],
  ["01043592335","Ziad I","vc"],
  ["01043599128","Ziad I","vc"],
  ["01031038143","MYSORE G","vc"],
  ["01097790697","MYSORE G","vc"],
  ["01070435675","Irigy M","vc"],
  ["01070638271","Irigy M","vc"]
];

const TYPES = {
  vc:{title:"فودافون كاش", app:"فودافون كاش"},
  ip:{title:"إنستا باي",   app:"إنستا باي"}
};

const listEl = document.getElementById("list");
const toast  = document.getElementById("toast");
let toastTimer, filter = "all";

function copyText(t){
  if(navigator.clipboard && window.isSecureContext){ return navigator.clipboard.writeText(t); }
  return new Promise((ok,no)=>{
    const a=document.createElement("textarea");
    a.value=t; a.style.cssText="position:fixed;opacity:0";
    document.body.appendChild(a); a.focus(); a.select();
    try{ document.execCommand("copy") ? ok() : no(); }catch(e){ no(); }
    document.body.removeChild(a);
  });
}

function showToast(html){
  toast.innerHTML = html;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toast.classList.remove("show"), 3200);
}

const ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';

function render(){
  listEl.innerHTML = "";
  ["vc","ip"].forEach(type=>{
    if(filter!=="all" && filter!==type) return;
    const rows = DATA.filter(r=>r[2]===type);
    if(!rows.length) return;

    const gt = document.createElement("div");
    gt.className = "group-title";
    gt.innerHTML = `<span class="dot ${type}"></span>${TYPES[type].title}<span class="count">${rows.length} ${rows.length>2?"أرقام":"رقم"}</span>`;
    listEl.appendChild(gt);

    rows.forEach(([num,name])=>{
      const b = document.createElement("button");
      b.className = "item";
      b.innerHTML = `
        <div class="avatar ${type}">${name.trim()[0].toUpperCase()}</div>
        <div class="info"><div class="who">${name}</div><div class="num">${num}</div></div>
        <div class="btn">${ICON}<span>نسخ</span></div>`;
      b.addEventListener("click", ()=>{
        copyText(num).then(()=>{
          b.classList.add("done");
          b.querySelector(".btn span").textContent = "تم النسخ";
          showToast(`تم نسخ الرقم ✓<small>افتح ${TYPES[type].app} والصق الرقم</small>`);
          setTimeout(()=>{ b.classList.remove("done"); b.querySelector(".btn span").textContent="نسخ"; }, 2500);
        }).catch(()=> showToast("مقدرناش ننسخ<small>اضغط مطولاً على الرقم وانسخه</small>"));
      });
      listEl.appendChild(b);
    });
  });
}

document.getElementById("tabs").addEventListener("click", e=>{
  const t = e.target.closest(".tab"); if(!t) return;
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");
  filter = t.dataset.f;
  render();
});

render();

/* إخفاء شاشة البداية وإظهار الصفحة */
window.addEventListener("load", ()=>{
  setTimeout(()=>{
    document.getElementById("splash").classList.add("hide");
    document.body.classList.add("ready");
  }, 2400);
});
</script>
</body>
</html>
