<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b1220">
<title>BeKach | صاحب المحل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b1220;--bg2:#111b30;--card:#16223a;--line:#24334f;--text:#f4f7fb;--muted:#9fb0c8;--green:#22c55e;--red:#ef4444;--vc:#e60000;--ip:#7c3aed}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{font-family:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#16315a 0%,var(--bg) 60%) fixed;color:var(--text);min-height:100vh}
  button,input,select{font:inherit;color:inherit}
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 70px}
  .hidden{display:none !important}
  header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  header svg{width:38px;height:38px}
  header .name{font-size:22px;font-weight:800;direction:ltr}
  header .name b{color:var(--green)}
  header .role{color:var(--muted);font-size:13px;font-weight:600;margin-right:4px}
  .logout{margin-right:auto;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}

  /* login */
  #login{max-width:380px;margin:12vh auto 0;text-align:center}
  #login svg{width:84px;height:84px;margin-bottom:8px}
  #login h1{font-size:26px;margin:6px 0 4px}
  #login p{color:var(--muted);margin:0 0 20px}
  #pw{width:100%;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;font-size:20px;text-align:center;outline:0;direction:ltr;letter-spacing:3px}
  #pw:focus{border-color:var(--green)}
  .err{color:#fca5a5;font-weight:700;min-height:26px;margin:10px 0}
  .primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;background:var(--green);color:#04210f;font-weight:800;font-size:18px;padding:15px;cursor:pointer}
  .primary:active{transform:scale(.98)} .primary:disabled{opacity:.6}

  /* new-since-last-visit */
  .banner{display:flex;align-items:center;gap:10px;background:#12301f;border:1px solid var(--green);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-weight:700}
  .banner button{margin-right:auto;background:var(--green);color:#04210f;border:0;border-radius:10px;padding:7px 14px;font-weight:800;cursor:pointer}

  /* stats */
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
  .stat small{color:var(--muted);font-weight:700;font-size:13px}
  .stat .big{font-size:26px;font-weight:800;direction:ltr;text-align:right;margin-top:2px}
  .stat .cnt{color:var(--muted);font-size:13px;font-weight:600}
  .stat.today{border-color:#1f6f3f}

  .tabs{display:flex;gap:8px;background:var(--bg2);padding:6px;border-radius:16px;border:1px solid var(--line);margin-bottom:14px}
  .tab{flex:1;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:14px;padding:10px 6px;border-radius:11px;cursor:pointer;transition:.2s}
  .tab.active{background:var(--green);color:#04210f}
  .sub{display:flex;gap:8px;margin-bottom:12px}
  .sub .tab{border:1px solid var(--line);background:var(--bg2);flex:none;padding:8px 18px}
  .sub .tab.active{border-color:var(--green);background:var(--green);color:#04210f}

  .daygrp{display:flex;align-items:center;gap:8px;margin:16px 4px 8px;font-weight:800}
  .daygrp span{margin-right:auto;color:var(--muted);font-weight:600;font-size:13px}
  .tx{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
  .tx.fresh{animation:flash 2.4s ease}
  @keyframes flash{0%,40%{background:#14532d;border-color:var(--green)}100%{background:var(--card);border-color:var(--line)}}
  .badge{flex:none;min-width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;direction:ltr;padding:0 6px}
  .tx .mid{flex:1;min-width:0}
  .tx .amt{font-weight:800;font-size:19px;direction:ltr;text-align:right}
  .tx .meta{color:var(--muted);font-size:13px;font-weight:600}
  .tx .time{color:var(--muted);font-size:12px;font-weight:700;direction:ltr;text-align:left}
  .empty{text-align:center;color:var(--muted);padding:26px 10px;border:1px dashed var(--line);border-radius:16px}
  .hint{color:var(--muted);font-size:12.5px;line-height:1.8;text-align:center;margin-top:10px}

  /* numbers */
  .nrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
  .nrow .info{flex:1;min-width:0}
  .nrow .nm{color:var(--muted);font-size:13px;font-weight:600;direction:ltr;text-align:right}
  .nrow .nn{font-size:19px;font-weight:800;letter-spacing:1px;direction:ltr;text-align:right}
  .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;color:#fff}
  .tag.vc{background:var(--vc)} .tag.ip{background:var(--ip)}
  .ibtn{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);display:grid;place-items:center;cursor:pointer}
  .ibtn.del{color:#fca5a5}
  .ibtn svg{width:18px;height:18px}
  .add{margin-bottom:12px}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:30}
  .sheet{width:100%;max-width:560px;background:var(--bg2);border-radius:24px 24px 0 0;border:1px solid var(--line);padding:20px 16px 26px;animation:sheet .3s ease}
  @keyframes sheet{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
  .sheet h3{margin:0 0 14px;font-size:20px}
  .sheet label{display:block;color:var(--muted);font-weight:700;font-size:13px;margin:10px 0 6px}
  .sheet input,.sheet select{width:100%;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:13px;font-size:17px;outline:0}
  .sheet input:focus,.sheet select:focus{border-color:var(--green)}
  .sheet .num{direction:ltr;text-align:right;letter-spacing:1px}
  .row2{display:flex;gap:10px;margin-top:16px}
  .row2 button{flex:1}
  .ghost{background:transparent;border:2px solid var(--line);border-radius:16px;font-weight:800;padding:13px;cursor:pointer}
  .danger{background:var(--red);color:#fff;border:0;border-radius:16px;font-weight:800;padding:13px;cursor:pointer}

  #toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-140px);width:calc(100% - 32px);max-width:500px;background:#fff;color:#0b1220;padding:14px 18px;border-radius:18px;font-weight:800;font-size:16px;line-height:1.7;box-shadow:0 12px 40px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,1,.3,1);z-index:60;text-align:center}
  #toast.show{transform:translate(-50%,0)}
  #toast small{display:block;font-weight:600;color:#475569;font-size:13px}
  .demo{background:#facc15;color:#422006;text-align:center;font-weight:800;font-size:12px;padding:3px}
</style>
</head>
<body>
<div id="demoBar"></div>
<div id="toast"></div>

<!-- تسجيل الدخول -->
<div id="login" class="wrap hidden">
  <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#15803d"/></linearGradient></defs>
    <rect width="120" height="120" rx="30" fill="url(#g1)"/>
    <path d="M40 28h24c13 0 20 7 20 16 0 6-3 10-8 13 7 3 11 8 11 15 0 11-8 20-23 20H40z" fill="#fff"/>
    <path d="M54 41v13h9c5 0 8-2 8-6.500S68 41 63 41zm0 28v14h10c6 0 9-3 9-7s-3-7-9-7z" fill="#15803d"/>
    <circle cx="90" cy="30" r="12" fill="#facc15"/>
  </svg>
  <h1>صاحب المحل</h1>
  <p>اكتب الباسورد عشان تدخل</p>
  <form id="loginForm" autocomplete="on">
    <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <button class="primary" id="loginBtn" type="submit">دخول</button>
  </form>
</div>

<!-- لوحة التحكم -->
<div id="dash" class="wrap hidden">
  <header>
    <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" rx="30" fill="url(#g1)"/>
      <path d="M40 28h24c13 0 20 7 20 16 0 6-3 10-8 13 7 3 11 8 11 15 0 11-8 20-23 20H40z" fill="#fff"/>
      <path d="M54 41v13h9c5 0 8-2 8-6.500S68 41 63 41zm0 28v14h10c6 0 9-3 9-7s-3-7-9-7z" fill="#15803d"/></svg>
    <div class="name">Be<b>Kach</b></div><span class="role">صاحب المحل</span>
    <button class="logout" id="logout">خروج</button>
  </header>

  <div id="newBanner" class="banner hidden"><span id="newBannerTxt"></span><button id="newBannerOk">تمام</button></div>

  <div class="stats">
    <div class="stat today"><small>النهاردة</small><div class="big" id="stDayAmt">0</div><div class="cnt" id="stDayCnt">0 عملية</div></div>
    <div class="stat"><small>الشهر ده</small><div class="big" id="stMonAmt">0</div><div class="cnt" id="stMonCnt">0 عملية</div></div>
  </div>

  <div class="tabs" id="mainTabs">
    <button class="tab active" data-t="tx">العمليات</button>
    <button class="tab" data-t="nums">الأرقام</button>
  </div>

  <section id="pTx">
    <div class="sub" id="subTabs">
      <button class="tab active" data-v="day">النهاردة</button>
      <button class="tab" data-v="month">الشهر</button>
    </div>
    <div id="txList"></div>
    <div class="hint">العملية بتتسجل لما العميل يضغط "اتصل". مفيش طريقة نعرف بيها إن التحويل نجح فعلاً.</div>
  </section>

  <section id="pNums" class="hidden">
    <button class="primary add" id="addBtn">+ إضافة رقم</button>
    <div id="numList"></div>
  </section>
</div>

<!-- نافذة الإضافة والتعديل -->
<div id="modal" class="modal hidden">
  <div class="sheet">
    <h3 id="mTitle">إضافة رقم</h3>
    <label>الاسم</label><input id="fName" maxlength="30" placeholder="مثال: Karim S">
    <label>رقم الموبايل (11 رقم)</label><input id="fNum" class="num" inputmode="numeric" maxlength="11" placeholder="01012345678">
    <label>نوع المحفظة</label>
    <select id="fType"><option value="vc">فودافون كاش</option><option value="ip">إنستا باي</option></select>
    <div class="err" id="mErr"></div>
    <div class="row2"><button class="ghost" id="mCancel">إلغاء</button><button class="primary" id="mSave">حفظ</button></div>
  </div>
</div>

<div id="confirm" class="modal hidden">
  <div class="sheet">
    <h3>تمسح الرقم ده؟</h3>
    <p id="cText" style="color:var(--muted);direction:ltr;text-align:right;margin:0 0 6px"></p>
    <div class="row2"><button class="ghost" id="cNo">لأ</button><button class="danger" id="cYes">امسح</button></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="db.js"></script>
<script>
const $ = id => document.getElementById(id);
const COMP = {vf:["فودافون","#e60000","V"], or:["أورنچ","#e05a00","O"], et:["اتصالات e&","#3f7d1e","e&"], we:["وي باي","#7c3aed","W"]};
const TYPES = {vc:"فودافون كاش", ip:"إنستا باي"};
const EDIT_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
const DEL_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>';

let numbers=[], txs=[], view="day", unsubs=[], seen=null, editingId=null, deletingId=null, audioCtx=null, unseenCount=0;
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n).toLocaleString("en-US");
const lsGet = k => { try{return localStorage.getItem(k)}catch(e){return null} };
const lsSet = (k,v) => { try{localStorage.setItem(k,v)}catch(e){} };

if(DB.demo){ $("demoBar").className="demo"; $("demoBar").textContent="وضع تجريبي، الباسورد demo1234 (Firebase لسه مش متوصل)"; }

/* ---------- وقت ---------- */
const startOfDay = () => { const d=new Date(); d.setHours(0,0,0,0); return d.getTime(); };
const startOfMonth = () => { const d=new Date(); d.setDate(1); d.setHours(0,0,0,0); return d.getTime(); };
const tm = ts => new Date(ts).toLocaleTimeString("ar-EG-u-nu-latn",{hour:"2-digit",minute:"2-digit"});
const dayLabel = ts => new Date(ts).toLocaleDateString("ar-EG-u-nu-latn",{weekday:"long",day:"numeric",month:"long"});

/* ---------- تنبيه ---------- */
function beep(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    [0,0.22].forEach(t=>{ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=t?1046:880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(.0001,audioCtx.currentTime+t); g.gain.exponentialRampToValueAtTime(.3,audioCtx.currentTime+t+.02); g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+t+.2);
      o.start(audioCtx.currentTime+t); o.stop(audioCtx.currentTime+t+.21); });
  }catch(e){}
}
let toastT;
function toast(html){ const t=$("toast"); t.innerHTML=html; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),5000); }
function alertTx(t){
  const c=COMP[t.company]||["؟","#555","?"];
  toast(`عملية جديدة ✓<small>${fmt(t.amount)} جنيه ← ${esc(t.name)} (${c[0]})</small>`);
  beep(); try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  unseenCount++; document.title=`(${unseenCount}) BeKach | صاحب المحل`;
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ unseenCount=0; document.title="BeKach | صاحب المحل"; } });

/* ---------- دخول ---------- */
$("loginForm").addEventListener("submit", e=>{
  e.preventDefault();
  try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); audioCtx.resume&&audioCtx.resume(); }catch(_){}
  $("loginErr").textContent=""; $("loginBtn").disabled=true;
  DB.login($("pw").value).catch(err=>{
    const c=err&&err.code||"";
    $("loginErr").textContent = /network/.test(c) ? "مفيش إنترنت" : /too-many/.test(c) ? "محاولات كتير، استنى شوية" : "الباسورد غلط";
  }).finally(()=>{ $("loginBtn").disabled=false; });
});
$("logout").addEventListener("click",()=>DB.logout());

DB.onAuth(ok=>{
  $("login").classList.toggle("hidden",ok); $("dash").classList.toggle("hidden",!ok);
  unsubs.forEach(f=>{try{f()}catch(e){}}); unsubs=[]; seen=null;
  if(ok){ $("pw").value=""; start(); }
});

function start(){
  unsubs.push(DB.onNumbers(rows=>{ numbers=rows; renderNums(); }));
  unsubs.push(DB.onTx(startOfMonth(), rows=>{
    if(seen===null){
      seen=new Set(rows.map(r=>r.id));
      const last=parseInt(lsGet("bk_lastSeen")||"0",10);
      const fresh=rows.filter(r=>r.ts>last);
      if(last && fresh.length){ $("newBannerTxt").textContent=`${fresh.length} عملية جديدة من آخر زيارة`; $("newBanner").classList.remove("hidden"); }
      if(!last) lsSet("bk_lastSeen",String(Date.now()));
    } else {
      const added=rows.filter(r=>!seen.has(r.id)); added.forEach(r=>seen.add(r.id));
      added.reverse().forEach(r=>{ alertTx(r); r._fresh=true; });
    }
    txs=rows; renderTx();
  }, e=>{ console.error(e); toast("مش قادر أقرا العمليات<small>اتأكد من قواعد Firebase</small>"); }));
}
$("newBannerOk").addEventListener("click",()=>{ lsSet("bk_lastSeen",String(Date.now())); $("newBanner").classList.add("hidden"); });
window.addEventListener("beforeunload",()=>lsSet("bk_lastSeen",String(Date.now())));

/* ---------- العمليات ---------- */
function rowHtml(t){
  const c=COMP[t.company]||["؟","#555","?"];
  return `<div class="tx ${t._fresh?"fresh":""}"><div class="badge" style="background:${c[1]}">${c[2]}</div>
    <div class="mid"><div class="amt">${fmt(t.amount)} جنيه</div><div class="meta">${esc(t.name)} · ${esc(t.num)} · ${c[0]}</div></div>
    <div class="time">${tm(t.ts)}</div></div>`;
}
function renderTx(){
  const sd=startOfDay(), day=txs.filter(t=>t.ts>=sd);
  const sum=a=>a.reduce((s,t)=>s+(t.amount||0),0);
  $("stDayAmt").textContent=fmt(sum(day)); $("stDayCnt").textContent=day.length+" عملية";
  $("stMonAmt").textContent=fmt(sum(txs)); $("stMonCnt").textContent=txs.length+" عملية";
  const L=$("txList");
  if(view==="day"){
    L.innerHTML = day.length ? day.map(rowHtml).join("") : `<div class="empty">مفيش عمليات النهاردة لسه</div>`;
  } else {
    if(!txs.length){ L.innerHTML=`<div class="empty">مفيش عمليات الشهر ده لسه</div>`; return; }
    const groups={}; txs.forEach(t=>{ const k=new Date(t.ts); k.setHours(0,0,0,0); (groups[k.getTime()]=groups[k.getTime()]||[]).push(t); });
    L.innerHTML=Object.keys(groups).sort((a,b)=>b-a).map(k=>{ const g=groups[k];
      return `<div class="daygrp">${dayLabel(+k)}<span>${g.length} عملية · ${fmt(sum(g))} جنيه</span></div>`+g.map(rowHtml).join(""); }).join("");
  }
  txs.forEach(t=>delete t._fresh);
}
$("subTabs").addEventListener("click",e=>{ const b=e.target.closest(".tab"); if(!b) return;
  document.querySelectorAll("#subTabs .tab").forEach(x=>x.classList.remove("active")); b.classList.add("active"); view=b.dataset.v; renderTx(); });
$("mainTabs").addEventListener("click",e=>{ const b=e.target.closest(".tab"); if(!b) return;
  document.querySelectorAll("#mainTabs .tab").forEach(x=>x.classList.remove("active")); b.classList.add("active");
  $("pTx").classList.toggle("hidden",b.dataset.t!=="tx"); $("pNums").classList.toggle("hidden",b.dataset.t!=="nums"); });

/* ---------- الأرقام ---------- */
function renderNums(){
  const L=$("numList");
  if(!numbers.length){
    L.innerHTML=`<div class="empty">مفيش أرقام لسه<br><br><button class="primary" id="seedBtn" style="max-width:280px;margin:auto">تحميل الأرقام الـ 17 الأساسية</button></div>`;
    $("seedBtn").onclick=()=>DB.seed().then(()=>toast("تم تحميل الأرقام ✓")).catch(()=>toast("فشل التحميل<small>اتأكد من قواعد Firebase</small>"));
    return;
  }
  L.innerHTML=numbers.map(n=>`<div class="nrow"><div class="info"><div class="nm">${esc(n.name)} <span class="tag ${n.type}">${TYPES[n.type]||""}</span></div><div class="nn">${esc(n.num)}</div></div>
    <button class="ibtn" data-e="${esc(n.id)}" aria-label="تعديل">${EDIT_SVG}</button><button class="ibtn del" data-d="${esc(n.id)}" aria-label="مسح">${DEL_SVG}</button></div>`).join("");
}
$("numList").addEventListener("click",e=>{
  const eb=e.target.closest("[data-e]"), db=e.target.closest("[data-d]");
  if(eb) openModal(eb.dataset.e);
  if(db){ deletingId=db.dataset.d; const n=numbers.find(x=>x.id===deletingId); $("cText").textContent=n?`${n.name} — ${n.num}`:""; $("confirm").classList.remove("hidden"); }
});
function openModal(id){
  editingId=id||null; const n=numbers.find(x=>x.id===id);
  $("mTitle").textContent = n?"تعديل رقم":"إضافة رقم";
  $("fName").value=n?n.name:""; $("fNum").value=n?n.num:""; $("fType").value=n?n.type:"vc"; $("mErr").textContent="";
  $("modal").classList.remove("hidden"); setTimeout(()=>$("fName").focus(),50);
}
$("addBtn").onclick=()=>openModal(null);
$("mCancel").onclick=()=>$("modal").classList.add("hidden");
$("fNum").addEventListener("input",e=>{ e.target.value=e.target.value.replace(/[^0-9]/g,""); });
$("mSave").onclick=()=>{
  const name=$("fName").value.trim(), num=$("fNum").value.trim(), type=$("fType").value;
  if(!name) return $("mErr").textContent="اكتب الاسم";
  if(!/^01[0-9]{9}$/.test(num)) return $("mErr").textContent="الرقم لازم يكون 11 رقم ويبدأ بـ 01";
  if(numbers.some(x=>x.num===num && x.id!==editingId)) return $("mErr").textContent="الرقم ده موجود قبل كده";
  $("mSave").disabled=true;
  (editingId?DB.updateNumber(editingId,{name,num,type}):DB.addNumber({name,num,type}))
    .then(()=>{ $("modal").classList.add("hidden"); toast("تم الحفظ ✓"); })
    .catch(()=>{ $("mErr").textContent="فشل الحفظ، اتأكد من الإنترنت"; })
    .finally(()=>{ $("mSave").disabled=false; });
};
$("cNo").onclick=()=>$("confirm").classList.add("hidden");
$("cYes").onclick=()=>{ DB.deleteNumber(deletingId).then(()=>toast("تم المسح ✓")).catch(()=>toast("فشل المسح")); $("confirm").classList.add("hidden"); };
[$("modal"),$("confirm")].forEach(m=>m.addEventListener("click",e=>{ if(e.target===m) m.classList.add("hidden"); }));
</script>
</body>
</html>
